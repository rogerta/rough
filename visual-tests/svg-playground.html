<html>

<head>
  <title>Rough SVG Playground</title>
<style>
body {
  margin: 0;
  padding: 1rem;
}

#element {
  position: relative;
  width: 400px;
  height:300px;
  box-sizing: border-box;
  /* The border of the element will contain the rough rectangle border.
   * Set it to transparent so that the browser itself does not try to
   * render anything itself */
  border: solid transparent 0.25rem;
  padding: 2rem;
  background: yellow;
}

svg {
  /* This position places the svg over the padding, but not over the border.
   * It could be made to be over the border too by using a top/left equal to
   * minus the border width and a width/height that takes into account the
   * borders. */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: lightgreen;
  /* Set to visible so that SVG elements can draw into the border area.  As
   * currently positioned, the bounds of the SVG do not cover the border. */
  overflow: visible;
}

label {
  display: block;
  margin-top: 1rem;
  font-weight: bold;
}
textarea {
  width: 400px;
}

kbd {
  background-color: #eeeeee;
  border-radius: 3px;
  border: 1px solid #b4b4b4;
  box-shadow:
    0 1px 1px rgb(0 0 0 / 0.2),
    0 2px 0 0 rgb(255 255 255 / 0.7) inset;
  color: #333333;
  display: inline-block;
  font-size: 0.85em;
  font-weight: bold;
  line-height: 1;
  padding: 2px 4px;
  white-space: nowrap;
}
</style>
</head>

<body>
<h1>Rough SVG Playground</h1>

<div class="coords">&nbsp;</div>
<div id="element">
  <!-- By not setting a viewBox on the SVG, it essentially becomes the CSS
       bounding box.  Setting the overflow to visible would still allow
       sub-elements to be visible outside this "viewBox".  This might be
       interesting so that the rough border are actually drawn in the CSS
       border area.  However, right now it's hard to predict the width of
       the rough border since it depends on some settings like roughness and
       bowing and also on random values.
  -->
  <svg></svg>
</div>
<div class="coords">&nbsp;</div>

<label for="cmd">Command</label>
<textarea id="cmd" autocorrect="off" rows="10"></textarea>
<div>
  Use <code>r.xxx(args)</code> where <code>xxx</code> is valid RoughSVG method.
  Press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to execute the line on which the cursor is located.
</div>

<script type="module">
import rough from '../src/rough.js';

const svg = document.querySelector('svg');
const coords = document.querySelectorAll('.coords');
svg.addEventListener('mousemove', e => {
  coords.forEach(c => c.innerText = `x=${e.layerX} y=${e.layerY}`);
});
svg.addEventListener('mouseleave', e => {
  coords.innerHTML = '&nbsp;'
});

const r = rough.svg(svg);

const cmd = document.querySelector('#cmd');
cmd.addEventListener('keyup', e => {
  if (e.key === 'Enter' && e.ctrlKey) {
    const text = e.target.value;
    localStorage.setItem('cmd', text);

    const pos = e.target.selectionStart;
    const start = text.lastIndexOf('\n', pos - 1) + 1;
    let end = text.indexOf('\n', pos);
    if (end === -1) {
      end = text.length;
    }

    const cmd = text.substring(start, end);
    if (cmd.startsWith('.')) {
      switch (cmd) {
        case '.clear':
          svg.replaceChildren();
          break;
      }
      return;
    }

    const ret = eval(cmd);
    if (ret instanceof SVGElement) {
      svg.append(ret);
    }
  }
});

const observer = new ResizeObserver(entries => {
  for (let entry of entries) {
    const { width, height } = entry.contentRect;
    const bwidth =
        parseFloat(getComputedStyle(entry.target.parentElement).borderWidth);
    const halfbwidth = bwidth / 2;
    const rect = r.rectangle(-halfbwidth, -halfbwidth, width + bwidth, height + bwidth,
      {maxRandomnessOffset: halfbwidth});
    svg.replaceChildren(rect);
  }
});
observer.observe(svg);

window.addEventListener('load', () => {
  const text = localStorage.getItem('cmd');
  if (text) {
    cmd.value = text;
  }
});
</script>

</body>

</html>
